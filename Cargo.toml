[package]
name = "franken-shell"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Pegasus Heavy Industries LLC"]
description = "The vibe-coded shell that does everything stupidly™"
repository = "https://github.com/pegasusheavy/franken-shell"
keywords = ["shell", "bash", "zsh", "terminal", "franken"]
categories = ["command-line-utilities"]

[dependencies]
# Readline-like functionality
rustyline = { version = "17", features = ["derive"] }

# Directory expansion and globbing
glob = "0.3"

# Environment and path handling
dirs = "6"

# Process handling
nix = { version = "0.30", features = ["process", "signal", "term", "fs"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Regex for pattern matching
regex = "1"

# Colored output
colored = "3"

# For hostname
hostname = "0.4"

# For which command lookup
which = "8"

# For tty detection
atty = "0.2"

# For time/date in prompts
chrono = "0.4"

# For async command execution (future use)
tokio = { version = "1", features = ["full"], optional = true }

# ============================================
# Performance optimization dependencies
# ============================================

# Fast hashing (FxHashMap) - much faster than default HashMap
rustc-hash = "2.1"

# String interning for variable names and keywords
lasso = "0.7"

# Small vector optimization (avoids heap for small collections)
smallvec = "1.14"

# Fast character/byte search using SIMD
memchr = "2.7"

# Once cell for lazy static initialization
once_cell = "1.20"

# Arena allocation for AST nodes (reduces allocation overhead)
bumpalo = { version = "3.16", features = ["collections"] }

# Perfect hash function for keyword lookup (compile-time generated)
phf = { version = "0.13", features = ["macros"] }

# Parallel execution for glob expansion and independent pipeline stages
rayon = "1.10"

# Crossbeam for lock-free concurrent data structures
crossbeam-channel = "0.5"

# ============================================
# JIT compilation dependencies (optional)
# ============================================

# Cranelift code generator
cranelift-codegen = { version = "0.127", optional = true }
cranelift-frontend = { version = "0.127", optional = true }
cranelift-module = { version = "0.131", optional = true }
cranelift-jit = { version = "0.127", optional = true }
cranelift-native = { version = "0.127", optional = true }

# Target triple for JIT
target-lexicon = { version = "0.13", optional = true }

[features]
default = []
async = ["tokio"]
jit = ["cranelift-codegen", "cranelift-frontend", "cranelift-module", "cranelift-jit", "cranelift-native", "target-lexicon"]

[[bin]]
name = "fsh"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
cargo-husky = { version = "1", default-features = false, features = ["precommit-hook", "run-cargo-check", "run-cargo-clippy", "run-cargo-fmt"] }
tempfile = "3"

[[bench]]
name = "lexer_bench"
harness = false

[[bench]]
name = "parser_bench"
harness = false

[[bench]]
name = "interpreter_bench"
harness = false

[[bench]]
name = "full_pipeline_bench"
harness = false

[[bench]]
name = "glob_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
lto = true
codegen-units = 1

# cargo-deb configuration for Debian packaging
[package.metadata.deb]
maintainer = "Pegasus Heavy Industries LLC <support@pegasusheavy.com>"
copyright = "2025, Pegasus Heavy Industries LLC"
license-file = ["LICENSE-MIT", "0"]
extended-description = """\
Franken Shell - The vibe-coded shell that does everything stupidly™ \
A monstrous creation stitched together from the best parts of Bash, ZSH, \
Fish, and POSIX shells. Features include match expressions, try/catch, \
named function parameters, built-in tmux, themes, and more chaos."""
depends = "$auto"
section = "shells"
priority = "optional"
assets = [
    ["target/release/fsh", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/franken-shell/README", "644"],
    ["CHANGELOG.md", "usr/share/doc/franken-shell/CHANGELOG", "644"],
]
maintainer-scripts = "debian/"

# cargo-generate-rpm configuration for RPM packaging
[package.metadata.generate-rpm]
assets = [
    { source = "target/release/fsh", dest = "/usr/bin/fsh", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/franken-shell/README.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/franken-shell/CHANGELOG.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/franken-shell/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/franken-shell/LICENSE-APACHE", mode = "644", doc = true },
]
post_install_script = """
if [ -f /etc/shells ]; then
    if ! grep -q "^/usr/bin/fsh$" /etc/shells; then
        echo "/usr/bin/fsh" >> /etc/shells
    fi
fi
"""
pre_uninstall_script = """
if [ -f /etc/shells ]; then
    sed -i '\\|^/usr/bin/fsh$|d' /etc/shells
fi
"""

[package.metadata.generate-rpm.requires]
glibc = "*"

# cargo-husky configuration for git hooks
[package.metadata.husky.hooks]
pre-commit = "cargo fmt -- --check && cargo clippy -- -D warnings && cargo check"
pre-push = "cargo test"
